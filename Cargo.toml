[workspace]
resolver = "2"
members = [
    "crates/agent-tool-parser-core",
    "crates/agent-tool-parser-c",
    "crates/agent-tool-parser-py",
    "crates/agent-tool-parser-wasm",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["InBoost Team"]
license = "MIT"
repository = "https://github.com/inboost-dev/agent-tool-parser"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
once_cell = "1.19"
html-escape = "0.2"
